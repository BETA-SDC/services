user www-data;
worker_processes 1;
pid /run/betasdc-nginx/nginx.pid;
lock_file /run/betasdc-nginx/nginx.lock;
error_log stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_body_temp_path /var/cache/betasdc-nginx/client;
    proxy_temp_path /var/cache/betasdc-nginx/proxy;
    fastcgi_temp_path /var/cache/betasdc-nginx/fastcgi;
    uwsgi_temp_path /var/cache/betasdc-nginx/uwsgi;
    scgi_temp_path /var/cache/betasdc-nginx/scgi;
    limit_req_zone $binary_remote_addr zone=registration:1m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    upstream registration_backend {
        server unix:/run/betasdc/backend.sock;
    }
    server {
        listen 10.16.125.52:443 ssl default_server;
        server_name account.betasdc.duckdns.org register.betasdc.duckdns.org;
        ssl_certificate /etc/betasdc/wildcard/fullchain.pem;
        ssl_certificate_key /etc/betasdc/wildcard/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:1m;
        if ($http_host !~ "^(account|register)\.betasdc\.duckdns\.org$") { return 444; }
        allow all;
        limit_conn connections 10;
        limit_conn_status 429;
        location ^~ /api/checkin/ {
            client_max_body_size 32k;
            if ($host = register.betasdc.duckdns.org) {
                return 308 https://account.betasdc.duckdns.org$request_uri;
            }
            proxy_pass http://registration_backend;
            proxy_http_version 1.1;
            proxy_set_header Host account.betasdc.duckdns.org;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
        location = /api/github/callback {
            # OAuth query parameters must not enter upstream error logs.
            error_log /dev/null crit;
            if ($host = register.betasdc.duckdns.org) {
                return 302 https://account.betasdc.duckdns.org$request_uri;
            }
            proxy_pass http://registration_backend;
            proxy_http_version 1.1;
            proxy_set_header Host account.betasdc.duckdns.org;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
        location ^~ /api/calendar/ {
            client_max_body_size 32k;
            if ($host = register.betasdc.duckdns.org) {
                return 308 https://account.betasdc.duckdns.org$request_uri;
            }
            proxy_pass http://registration_backend;
            proxy_http_version 1.1;
            proxy_set_header Host account.betasdc.duckdns.org;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
        location / {
            if ($host = register.betasdc.duckdns.org) {
                return 308 https://account.betasdc.duckdns.org$request_uri;
            }
            proxy_pass http://registration_backend;
            proxy_http_version 1.1;
            proxy_set_header Host account.betasdc.duckdns.org;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
        location ~ ^/api/(register|login|signup/code|github/link|github/unlink|github/refresh|verification/resend|verification/confirm)$ {
            if ($host = register.betasdc.duckdns.org) {
                return 308 https://account.betasdc.duckdns.org$request_uri;
            }
            limit_req zone=registration burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://registration_backend;
            proxy_http_version 1.1;
            proxy_set_header Host account.betasdc.duckdns.org;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
    }
    include /etc/betasdc/*.nginx.conf;
}
